function formatFileSize(bytes){
  if(!bytes||isNaN(bytes))return '0 B';
  if(bytes<1024)return bytes+' B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
  return (bytes/(1024*1024)).toFixed(1)+' MB';
}

function getBatchOverallPercent(){
  if(!batchQueue.length)return 0;
  const total = batchQueue.reduce((acc,item)=>acc+(item.progress||0),0);
  return Math.round(total / batchQueue.length);
}

function updateBatchItemUI(item){
  const fill = document.getElementById("batch-fill-" + item.id);
  const pct = document.getElementById("batch-pct-" + item.id);
  const badge = document.getElementById("batch-badge-" + item.id);
  if (fill) {
    fill.style.width = item.progress + "%";
    fill.className = "batch-bar-fill " + (item.status === "done" ? "done" : item.status === "error" ? "err" : "");
  }
  if (pct) pct.textContent = item.progress + "%";
  if (badge) {
    badge.className = "batch-status-badge batch-status-" + item.status;
    badge.innerHTML = item.status === "pending" ? "⏳ Ready" : item.status === "uploading" ? `⚡ Uploading ${item.progress}%` : item.status === "done" ? "✓ Uploaded" : "✕ Failed";
  }
}

function updateOverallUI(){
  const overallBar = document.getElementById("batch-overall-bar");
  if (overallBar) {
    overallBar.style.width = getBatchOverallPercent() + "%";
  }
}

function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function uploadFileWithProgress(item, base64Data){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload", true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.min(95, Math.round(30 + (e.loaded / e.total) * 65));
        item.progress = pct;
        updateBatchItemUI(item);
        updateOverallUI();
      }
    };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const json = JSON.parse(xhr.responseText);
          resolve(json);
        } catch (e) {
          reject(new Error("Invalid server response format"));
        }
      } else {
        try {
          const err = JSON.parse(xhr.responseText);
          reject(new Error(err.error || "Server error"));
        } catch (_) {
          reject(new Error("HTTP error " + xhr.status));
        }
      }
    };

    xhr.onerror = () => reject(new Error("Network connection error"));

    xhr.send(JSON.stringify({
      filename: item.name,
      data: base64Data,
      category: item.category
    }));
  });
}

async function checkSupabaseHealth(){
const badge=$("#sb-status"),msg=$("#sb-msg");
if(!badge)return;
badge.textContent="Checking...";badge.style.color="var(--gold)";
if(!SB){
badge.textContent="Disconnected";badge.style.color="#ff6b6b";
if(msg)msg.textContent="Supabase client not initialized. Please enter your Project URL and Key above.";
return;
}
try{
const{data,error}=await SB.from("site_content").select("id").limit(1);
if(error){
if(error.code==="42P01"||error.message?.includes("does not exist")||error.message?.includes("relation")){
badge.textContent="Connected (Tables needed)";badge.style.color="#ffd166";
if(msg)msg.textContent="✓ Connected to Supabase! Run the SQL script below to initialize the tables.";
}else{
badge.textContent="Auth/Key Error";badge.style.color="#ff6b6b";
if(msg)msg.textContent="Supabase error: "+error.message;
}
}else{
badge.textContent="Connected ✓";badge.style.color="#25d366";
if(msg)msg.textContent="✓ Successfully connected to live Supabase database!";
}
}catch(e){
badge.textContent="Connection Failed";badge.style.color="#ff6b6b";
if(msg)msg.textContent="Failed to reach Supabase: "+(e.message||e);
}
}

  };

  galDropzone.ondragover=e=>{
    e.preventDefault();
    e.stopPropagation();
    galDropzone.classList.add("dragover");
  };

  galDropzone.ondragleave=e=>{
    e.preventDefault();
    e.stopPropagation();
    galDropzone.classList.remove("dragover");
  };

  const handleFiles=files=>{
    const defaultCat=batchCatSelect?batchCatSelect.value:"Wedding";
    let added=0;
    Array.from(files).forEach(file=>{
      if(!file.type.startsWith("image/"))return;
      const id="b_"+Date.now()+"_"+Math.random().toString(36).substr(2,6);
      const preview=URL.createObjectURL(file);
      batchQueue.push({
        id,
        file,
        name:file.name,
        size:file.size,
        category:defaultCat,
        preview,
        progress:0,
        status:"pending",
        error:null,
        uploadedUrl:null
      });
      added++;
    });

    if(added>0){
      showToast(`Selected ${added} photo${added>1?"s":""} for batch upload`);
      admin();
    }
  };

  galDropzone.ondrop=e=>{
    e.preventDefault();
    e.stopPropagation();
    galDropzone.classList.remove("dragover");
    if(e.dataTransfer&&e.dataTransfer.files){
      handleFiles(e.dataTransfer.files);
    }
  };

  galBatchInput.onchange=e=>{
    if(e.target.files){
      handleFiles(e.target.files);
      galBatchInput.value="";
    }
  };
}

// Start Batch Upload
if(batchStartBtn){
  batchStartBtn.onclick=async()=>{
    const pendingItems=batchQueue.filter(x=>x.status!=="done");
    if(!pendingItems.length){
      showToast("All photos in the batch are already uploaded!");
      return;
    }

    batchStartBtn.disabled=true;
    batchStartBtn.textContent="⏳ Uploading Photos…";
    if(batchClearBtn)batchClearBtn.disabled=true;

    const sub=$("#batch-status-sub");
    let uploadedCount=0;

    for(let i=0;i<batchQueue.length;i++){
      const item=batchQueue[i];
      if(item.status==="done")continue;

      item.status="uploading";
      item.progress=15;
      updateBatchItemUI(item);
      if(sub)sub.textContent=`Uploading photo ${uploadedCount+1} of ${pendingItems.length}: ${item.name}…`;

      try{
        const base64Data=await readFileAsBase64(item.file);
        item.progress=35;
        updateBatchItemUI(item);

        const res=await uploadFileWithProgress(item,base64Data);
        item.progress=100;
        item.status="done";
        item.uploadedUrl=res.url;
        updateBatchItemUI(item);

        D.gallery.unshift({
          u:res.url,
          c:item.category
        });
        uploadedCount++;
      }catch(err){
        console.error("Upload error for",item.name,err);
        item.status="error";
        item.error=err.message||"Upload failed";
        updateBatchItemUI(item);
      }

      updateOverallUI();
    }

    batchStartBtn.disabled=false;
    batchStartBtn.textContent="⚡ Start Batch Upload";
    if(batchClearBtn)batchClearBtn.disabled=false;

    if(sub)sub.textContent=`Uploaded ${uploadedCount} photos successfully to portfolio!`;
    showToast(`Batch complete! Added ${uploadedCount} photo${uploadedCount>1?"s":""} to gallery ✓`);

    site();
    admin();
  };
}

if(!error&&data&&data.length){items=data;try{safeSet("av_leads",JSON.stringify(items));}catch(_){}}
}catch(e){}
}

      D = { ...D, ...parsed };
      D.stats = D.stats || [];
      D.reels = D.reels || [];
      D.services = D.services || [];
      D.gallery = D.gallery || [];
      D.reviews = D.reviews || [];
      D.igPosts = D.igPosts || [];

// Background sync: Config, Supabase Cloud Content, and Instagram
(async () => {
  try {
    const res = await fetch("/api/config");
    if (res.ok) {
      const cfg = await res.json();
      if (cfg.supabaseUrl && !safeGet("sb_url")) sbUrl = cfg.supabaseUrl;
      if (cfg.supabaseAnonKey && !safeGet("sb_key")) sbKey = cfg.supabaseAnonKey;
      initSupabase(sbUrl, sbKey);
    }
  } catch (e) {}

  if (SB) {
    try {
      const r = await Promise.race([
        SB.from("site_content").select("data").eq("id", 1).maybeSingle(),
        new Promise(res => setTimeout(() => res(null), 2500))
      ]);
      if (r && r.data && r.data.data) {
        D = { ...D, ...r.data.data };
        D.stats = D.stats || [];
        D.reels = D.reels || [];
        D.services = D.services || [];
        D.gallery = D.gallery || [];
        D.reviews = D.reviews || [];
        D.igPosts = D.igPosts || [];
        D.trendingHashtags = D.trendingHashtags || [];
        site();
      }
    } catch (x) {}
  }

  try {
    await fetchInstagramFeed();
  } catch (e) {}
})();
